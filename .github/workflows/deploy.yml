name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: |
          npm run build
          test -s dist/index.html

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '187.124.129.55' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" satyatech.org >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload & deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || '187.124.129.55' }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
        run: |
          DEPLOY_RELEASE="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          ARCHIVE="/tmp/satya-frontend-${DEPLOY_RELEASE}.tgz"
          tar -czf "$ARCHIVE" -C dist .
          scp -i ~/.ssh/deploy_key "$ARCHIVE" "${SSH_USER}@${SSH_HOST}:/tmp/satya-frontend-${DEPLOY_RELEASE}.tgz"
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "bash -s -- '$DEPLOY_RELEASE'" < deployment/frontend-remote.sh
